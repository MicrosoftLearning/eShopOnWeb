name: deploy to azure

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: .NET Restore
        run: dotnet restore ./eShopOnWeb.sln
      - name: .NET build
        run: dotnet build ./eShopOnWeb.sln --configuration Release
      - name: .NET publish
        run: dotnet publish ./src/Web --configuration Release -o ./publish/web
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web
          path: ./publish/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: web
          path: web

      - name: Deploye Azure WebApp
        uses: Azure/webapps-deploy@v3.0.8
        with:
          # Name of the Azure Web App
          app-name: eshoponweb-github
          package: web
          resource-group-name: gh-200
      
